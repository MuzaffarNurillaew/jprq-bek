name: CLI Image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/muzaffarnurillaew/jprq-agent

permissions: {}

jobs:
  build-and-push:
    name: Build and push agent image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check for relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            cli:
              - 'cli/**'
              - 'Dockerfile.agent'

      - name: Compute image tag
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.filter.outputs.cli == 'true' || github.ref_type == 'tag'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build agent image
        if: steps.filter.outputs.cli == 'true' || github.ref_type == 'tag'
        run: make docker-build-agent AGENT_IMG=${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}

      - name: Push agent image
        if: steps.filter.outputs.cli == 'true' || github.ref_type == 'tag'
        run: make docker-push-agent AGENT_IMG=${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
