---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - tunnel.jprq.io
  resources:
  - jprqtunnels
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tunnel.jprq.io
  resources:
  - jprqtunnels/finalizers
  verbs:
  - update
- apiGroups:
  - tunnel.jprq.io
  resources:
  - jprqtunnels/status
  verbs:
  - get
  - patch
  - update
