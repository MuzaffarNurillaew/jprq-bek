# This rule is not used by the project jprq-bek itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the tunnel.jprq.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: jprq-bek
    app.kubernetes.io/managed-by: kustomize
  name: jprqtunnel-editor-role
rules:
- apiGroups:
  - tunnel.jprq.io
  resources:
  - jprqtunnels
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tunnel.jprq.io
  resources:
  - jprqtunnels/status
  verbs:
  - get
