---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: jprqtunnels.tunnel.jprq.io
spec:
  group: tunnel.jprq.io
  names:
    kind: JprqTunnel
    listKind: JprqTunnelList
    plural: jprqtunnels
    singular: jprqtunnel
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.subdomain
      name: Subdomain
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.backendAddress
      name: Backend
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: JprqTunnel is the Schema for the jprqtunnels API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of JprqTunnel
            properties:
              backend:
                description: backend is the in-cluster Service to expose.
                properties:
                  namespace:
                    description: namespace of the backend Service.
                    minLength: 1
                    type: string
                  port:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      port is a Service port name or number. Names are resolved to a number by
                      the controller, so the agent only ever sees a number and therefore needs
                      no API access of its own (DESIGN.md §9.2).
                    x-kubernetes-int-or-string: true
                  serviceName:
                    description: serviceName of the backend Service.
                    minLength: 1
                    type: string
                required:
                - namespace
                - port
                - serviceName
                type: object
              cname:
                description: |-
                  cname is reserved for custom hostnames. Schema only in v1alpha1, and
                  rejected at admission (DESIGN.md §11).
                properties:
                  cloudflareTokenSecret:
                    description: cloudflareTokenSecret names the Secret holding a
                      Cloudflare API token.
                    properties:
                      key:
                        default: authToken
                        description: key within the Secret holding the raw token.
                        type: string
                      name:
                        description: name of the Secret, which must live in the operator
                          namespace.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  hostname:
                    description: hostname to serve, e.g. tunnel.example.com.
                    type: string
                required:
                - cloudflareTokenSecret
                - hostname
                type: object
              jprqTokenSecret:
                description: jprqTokenSecret names the Secret holding the jprq auth
                  token.
                properties:
                  key:
                    default: authToken
                    description: key within the Secret holding the raw token.
                    type: string
                  name:
                    description: name of the Secret, which must live in the operator
                      namespace.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              subdomain:
                description: |-
                  subdomain is the public name to claim, reachable at
                  https://<subdomain>.<jprq domain>.

                  The bounds and pattern are the jprq server's own rules transcribed, so
                  every subdomain this API accepts is one the server will accept, making
                  "invalid subdomain" structurally impossible at runtime rather than a
                  crash-loop to diagnose (DESIGN.md §5.2).
                maxLength: 38
                minLength: 3
                pattern: ^[a-z0-9](?:[a-z0-9]|-[a-z0-9]){2,37}$
                type: string
              subdomainCollisionBehavior:
                default: fail
                description: |-
                  subdomainCollisionBehavior decides what happens when the jprq server
                  reports the subdomain is already taken. Collisions are only discoverable
                  by trying, since jprq exposes no list-tunnels API (DESIGN.md §9.3).

                  "fail" records a terminal failure and does not retry. "retry" leaves the
                  agent to keep re-claiming until the holder releases the name.
                  "addSuffix" is schema-visible but rejected in v1alpha1.
                enum:
                - fail
                - retry
                - addSuffix
                type: string
            required:
            - backend
            - jprqTokenSecret
            - subdomain
            type: object
            x-kubernetes-validations:
            - message: subdomains 'www' and 'jprq' are reserved by the jprq server
              rule: self.subdomain != 'www' && self.subdomain != 'jprq'
            - message: subdomainCollisionBehavior 'addSuffix' is not implemented in
                v1alpha1
              rule: '!has(self.subdomainCollisionBehavior) || self.subdomainCollisionBehavior
                != ''addSuffix'''
            - message: spec.cname is not implemented in v1alpha1
              rule: '!has(self.cname)'
          status:
            description: status defines the observed state of JprqTunnel
            properties:
              assignedSubdomain:
                description: |-
                  assignedSubdomain is the subdomain actually claimed. Equal to
                  spec.subdomain in v1alpha1; kept distinct so addSuffix can pin a
                  generated name here later without a status migration (DESIGN.md §5.5).
                type: string
              backendAddress:
                description: |-
                  backendAddress is the resolved host:port the agent was given, with the
                  Service port name already resolved to a number. Answers "what did the
                  agent actually dial?" and powers the BACKEND printer column.
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the JprqTunnel resource.

                  Condition types are Ready, BackendReady and TokenReady: three independent
                  causes of not-working, each separately observable.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastExitCode:
                description: |-
                  lastExitCode is the agent's most recent container exit code, which is how
                  server verdicts are classified (DESIGN.md §7.2).
                format: int32
                type: integer
              lastFailureMessage:
                description: lastFailureMessage is the most recent human-readable
                  failure.
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the spec generation this status reflects. Also the
                  gate on sticky terminal failures.
                format: int64
                type: integer
              phase:
                description: |-
                  phase is a derived summary for humans and printer columns: Pending,
                  Active, Degraded or Failed. Conditions are the machine-readable truth.

                  Failed is sticky: it clears only when metadata.generation changes, so
                  re-applying unchanged YAML does not re-arm a failed tunnel. This is what
                  stops a rejected token from crash-looping forever (DESIGN.md §5.5, §10.1).
                type: string
              podName:
                description: podName is the agent Pod in the operator namespace.
                type: string
              restartCount:
                description: |-
                  restartCount mirrors kubelet's container restart count. Since the agent
                  exits whenever the event stream drops, restartPolicy: Always is the
                  reconnect mechanism and this is a truthful health signal (DESIGN.md §6.2).
                format: int32
                type: integer
              url:
                description: url is the public address of the tunnel.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
